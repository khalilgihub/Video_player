directories:
  output: dist
  buildResources: assets
appId: com.hybridplayer.app
productName: Hybrid Player
files:
  - filter:
      - src/**/*
      - assets/**/*
      - package.json
      - '!node_modules/ffmpeg-static/**/*'
extraResources:
  - from: mpv/
    to: mpv/
    filter:
      - '**/*'
  - from: node_modules/ffmpeg-static/
    to: ffmpeg/
    filter:
      - ffmpeg*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icons/icon.ico
  signAndEditExecutable: true
mac:
  target:
    - dmg
  category: public.app-category.entertainment
  icon: icons/icon.png
linux:
  target:
    - AppImage
    - deb
  category: Video
  icon: icons/icon-linux.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronVersion: 40.10.2
